  help:
    main: "This is the help menu, you can choose an action to read it's manual."
    open: "Opens an interface, terminal, file explorer, or program. Parameter: 'window' specifies what to open (gui, cmd, shell, explorer, a program path or a URL) and 'folder' can define the starting directory."
    wait: "Pauses the macro for a given number of seconds. Parameter: 'time' specifies the duration of the pause in seconds."
    write: "Simulates typing text on the keyboard. Parameters: 'text' is the text to write and 'interval' is the delay between each character."
    click: "Performs one or multiple mouse clicks. Parameters: 'x' and 'y' define the position (you can only put one of them so the mouse will stay on the same coordinate for the non-specified axis), 'clicks' the number of clicks, 'interval' the delay between clicks, 'button' the mouse button (primary, secondary, middle), and 'duration' the time to move the cursor."
    moveto: "Moves the mouse cursor to a specific screen position. Parameters: 'x' and 'y' define the target position (you can only put one of them so the mouse will stay on the same coordinate for the non-specified axis) and 'duration' the movement time."
    move: "Moves the mouse cursor relative to its current position. Parameters: 'x' and 'y' define the horizontal and vertical offset (you can only put one of them so the mouse will stay on the same coordinate for the non-specified axis) and 'duration' the movement time."
    press: "Presses a keyboard key. Parameters: 'keys' defines the key, 'presses' the number of times it is pressed, and 'interval' the delay between presses."
    hotkey: "Executes a keyboard shortcut such as ctrl+c or alt+tab. Parameter: 'keys' contains the key combination separated by '+'."
    hold: "Keeps a keyboard key pressed down. Parameter: 'key' specifies the key to hold."
    release: "Releases a key previously held with 'hold'. Parameter: 'key' specifies the key to release."
    scroll: "Scrolls using the mouse wheel. Parameters: 'direction' can be 'vertical' or 'horizontal', 'amount' defines the scroll quantity, and 'x' and 'y' define the cursor position, (you can only put one of them so the mouse will stay on the same coordinate for the non-specified axis)."
    dragto: "Drags the mouse to a specific position while holding the click. Parameters: 'x' and 'y' define the target position and 'duration' the drag time."
    drag: "Drags the mouse relative to its current position while holding the click. Parameters: 'x' and 'y' define the offset (you can only put one of them so the mouse will stay on the same coordinate for the non-specified axis) and 'duration' the drag time."
    screenshot: "Takes a screenshot and saves it as a PNG file. Parameters: 'name' defines the file name and 'path' the folder where it will be saved."